services:
  # 1. Cơ sở dữ liệu Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-AdminPassword@123}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - app-network
    restart: unless-stopped

  # 2. Ứng dụng Backend Express 5 + Sequelize
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-QuanLySinhVienDB}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-AdminPassword@123}
      JWT_SECRET: ${JWT_SECRET:-supersecretkeychuong09forproductiontest}
      JWT_EXPIRES_IN: "3600"
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/public/uploads
    depends_on:
      - sqlserver
    networks:
      - app-network
    restart: unless-stopped

volumes:
  sqlserver-data:
    name: sqlserver-data
  uploads-data:
    name: uploads-data

networks:
  app-network:
    driver: bridge
