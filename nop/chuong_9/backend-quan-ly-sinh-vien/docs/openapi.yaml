openapi: 3.0.3
info:
  title: API Quản lý sinh viên - Phân trang, Tìm kiếm & Xử lý lỗi tập trung
  version: 1.0.0
  description: RESTful CRUD SinhVien, Pagination & Search, Global Error Handling - thực hành Chương 08.
servers:
  - url: /
    description: Cùng host và port với Express
tags:
  - name: Auth
    description: Xác thực tài khoản (Register, Login, Profile)
  - name: SinhVien
    description: Quản lý sinh viên (Public xem, Admin ghi)

paths:
  # ================= AUTH ENDPOINTS =================
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản sinh viên mới
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email đã được sử dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập nhận Access Token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Xem hồ sơ người dùng đang đăng nhập
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/me/avatar:
    post:
      tags: [Auth]
      summary: Upload ảnh đại diện cho tài khoản đang đăng nhập (Multer <= 2MB)
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: File ảnh đại diện định dạng JPEG hoặc PNG (tối đa 2MB)
      responses:
        '200':
          description: Cập nhật ảnh đại diện thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật ảnh đại diện thành công
                  data:
                    type: object
                    required: [avatarUrl]
                    properties:
                      avatarUrl:
                        type: string
                        example: /uploads/1730379200000-avatar.png
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File quá kích thước cho phép (> 2MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================= SINH VIEN ENDPOINTS =================
  /api/v1/sinh-vien:
    get:
      tags: [SinhVien]
      summary: Lấy danh sách sinh viên phân trang và tìm kiếm (Public)
      operationId: getDanhSachSinhVien
      parameters:
        - name: page
          in: query
          required: false
          description: Số thứ tự trang (>= 1, mặc định 1)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Số lượng sinh viên trên mỗi trang (1-50, mặc định 10)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
        - name: search
          in: query
          required: false
          description: Từ khóa tìm kiếm theo họ tên sinh viên (tối đa 80 ký tự)
          schema:
            type: string
            maxLength: 80
            example: Anh
      responses:
        '200':
          description: Thành công, trả về mảng dữ liệu và metadata phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [SinhVien]
      summary: Thêm sinh viên mới (Yêu cầu Admin)
      operationId: taoSinhVien
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinhVien'
      responses:
        '201':
          description: Tạo sinh viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/sinh-vien/{maSV}:
    parameters:
      - $ref: '#/components/parameters/MaSV'
    get:
      tags: [SinhVien]
      summary: Lấy sinh viên theo mã (Public)
      operationId: getSinhVienTheoMa
      responses:
        '200':
          description: Tìm thấy sinh viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [SinhVien]
      summary: Cập nhật thông tin sinh viên (Yêu cầu Admin)
      operationId: capNhatSinhVien
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinhVienCapNhat'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [SinhVien]
      summary: Xóa sinh viên theo mã (Yêu cầu Admin)
      operationId: xoaSinhVien
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập Access Token JWT theo định dạng Bearer <token>

  parameters:
    MaSV:
      name: maSV
      in: path
      required: true
      description: Mã sinh viên (chữ in hoa và số, tối đa 20 ký tự)
      schema:
        type: string
        example: SV01

  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      additionalProperties: false
      properties:
        fullName:
          type: string
          example: Nguyen Minh An
        email:
          type: string
          format: email
          example: an.lab@example.com
        password:
          type: string
          format: password
          example: SinhVien@123
    RegisterResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Đăng ký tài khoản thành công
        data:
          type: object
          properties:
            id:
              type: integer
              example: 2
            fullName:
              type: string
              example: Nguyen Minh An
            email:
              type: string
              example: an.lab@example.com
            role:
              type: string
              example: student
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: an.lab@example.com
        password:
          type: string
          format: password
          example: SinhVien@123
    LoginResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login success
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 3600
    ProfileResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Lấy thông tin tài khoản thành công
        data:
          type: object
          properties:
            id:
              type: integer
              example: 2
            fullName:
              type: string
              example: Nguyen Minh An
            email:
              type: string
              example: an.lab@example.com
            role:
              type: string
              example: student
    SinhVien:
      type: object
      required: [maSV, hoTen, email, maLop]
      properties:
        maSV:
          type: string
          example: SV01
        hoTen:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          format: email
          example: nva@example.com
        maLop:
          type: string
          example: D21_TH01
    SinhVienCapNhat:
      type: object
      required: [hoTen, email, maLop]
      properties:
        hoTen:
          type: string
          example: Nguyễn Văn B
        email:
          type: string
          format: email
          example: nvb@example.com
        maLop:
          type: string
          example: D21_TH02
    SinhVienResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        message:
          type: string
          example: Thao tác thành công
        data:
          $ref: '#/components/schemas/SinhVien'
    SinhVienListResponse:
      type: object
      required: [success, message, data, pagination]
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        message:
          type: string
          example: Lấy danh sách sinh viên thành công
        data:
          type: array
          items:
            $ref: '#/components/schemas/SinhVien'
        pagination:
          type: object
          required: [page, limit, totalItems, totalPages]
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            totalItems:
              type: integer
              example: 5
            totalPages:
              type: integer
              example: 1
    DeleteResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        message:
          type: string
          example: Xóa sinh viên thành công
    ValidationIssue:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Email không hợp lệ
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
          example: false
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Yêu cầu không thực hiện được
        data:
          type: object
          nullable: true
          example: null
        errors:
          type: array
          description: Chi tiết lỗi Validation (nếu có)
          items:
            $ref: '#/components/schemas/ValidationIssue'

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực token hoặc token không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền truy cập (Yêu cầu role admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột dữ liệu (Mã hoặc email đã tồn tại)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Lỗi ngoài dự kiến trên server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
